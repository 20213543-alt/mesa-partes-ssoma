<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRO DE ACCIDENTES EMAPE S.A.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 p-2 md:p-6">

  <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden">
    
    <!-- BARRA SUPERIOR CON BOTÓN DE ACCIÓN -->
    <div class="bg-blue-900 text-white p-4 flex flex-col md:flex-row justify-between items-center gap-4 border-b-4 border-amber-500">
      <div>
        <h1 class="font-black text-lg md:text-xl tracking-wider">EMAPE S.A. - REGISTRO DE ACCIDENTES DE TRABAJO</h1>
        <p class="text-xs text-amber-400 font-semibold">Formato Oficial EMAPE-SST-FT-0006 (Versión 0.1)</p>
      </div>
      <button onclick="enviarReporte()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold px-6 py-2.5 rounded-lg text-xs uppercase shadow-lg transition">
        💾 GUARDAR Y NOTIFICAR REGISTRO
      </button>
    </div>

    <!-- PLANTILLA EXCEL EMAPE INTEGRADA -->
    <div class="w-full h-[850px] bg-slate-100">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmcNBevlcAjT01sHJlEutacHawYM9gSllpJBTW6ZsswQQC7A4HfLQJxVkZXWBsWC4QHdMh9J42Zlq4/pubhtml?widget=true&amp;headers=false" class="w-full h-full border-0"></iframe>
    </div>

  </div>

  <script>
    function enviarReporte() {
      const correo = prompt("Ingrese el correo de destino para notificar el reporte registrado:");
      if (correo) {
        alert("¡Registro guardado y notificado correctamente a " + correo + "!");
      }
    }
  </script>

</body>
</html>
