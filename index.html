<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMAPE S.A. - REGISTRO DE ACCIDENTES</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800 font-sans p-3 md:p-6">

  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden border border-slate-300">
    
    <!-- ENCABEZADO FORMATO OFICIAL -->
    <div class="bg-blue-900 text-white p-5 border-b-4 border-amber-500 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-black tracking-wider">EMAPE S.A.</h1>
        <h2 class="text-sm font-bold text-amber-400">REGISTRO DE ACCIDENTES DE TRABAJO</h2>
      </div>
      <div class="text-right text-xs bg-blue-950 p-2.5 rounded border border-blue-800">
        <p><strong>Código:</strong> EMAPE-SST-FT-0006</p>
        <p><strong>Versión:</strong> 0.1</p>
      </div>
    </div>

    <!-- FORMULARIO EDITABLE -->
    <form action="/enviar-reporte" method="POST" class="p-6 space-y-6 text-xs">

      <!-- DATOS GENERALES -->
      <div class="bg-slate-50 p-4 rounded border border-slate-300 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="font-bold block text-slate-700 mb-1">Nº de Informe</label>
          <input type="text" name="no_informe" placeholder="INF-2026-001" required class="w-full border rounded p-2 bg-white">
        </div>
        <div>
          <label class="font-bold block text-slate-700 mb-1">Fecha del Informe</label>
          <input type="date" name="fecha_informe" required class="w-full border rounded p-2 bg-white">
        </div>
        <div>
          <label class="font-bold block text-slate-700 mb-1">Tipo de Evento</label>
          <select name="tipo_evento" class="w-full border rounded p-2 bg-white">
            <option value="Accidente de Trabajo">Accidente de Trabajo</option>
            <option value="Incidente Peligroso">Incidente Peligroso</option>
            <option value="Incidente">Incidente</option>
          </select>
        </div>
      </div>

      <!-- DATOS DEL TRABAJADOR -->
      <div class="border border-blue-900 rounded overflow-hidden">
        <div class="bg-blue-900 text-white p-2 font-bold uppercase">3. DATOS DEL TRABAJADOR ACCIDENTADO</div>
        <div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50">
          <div class="md:col-span-2">
            <label class="font-bold block text-slate-700 mb-1">Apellidos y Nombres</label>
            <input type="text" name="nombre_trabajador" required class="w-full border rounded p-2 bg-white">
          </div>
          <div>
            <label class="font-bold block text-slate-700 mb-1">DNI / CE</label>
            <input type="text" name="dni" class="w-full border rounded p-2 bg-white">
          </div>
          <div>
            <label class="font-bold block text-slate-700 mb-1">Edad</label>
            <input type="number" name="edad" class="w-full border rounded p-2 bg-white">
          </div>
          <div>
            <label class="font-bold block text-slate-700 mb-1">Área de Trabajo</label>
            <input type="text" name="area" class="w-full border rounded p-2 bg-white">
          </div>
          <div>
            <label class="font-bold block text-slate-700 mb-1">Puesto de Trabajo</label>
            <input type="text" name="puesto" class="w-full border rounded p-2 bg-white">
          </div>
        </div>
      </div>

      <!-- INVESTIGACIÓN DEL EVENTO -->
      <div class="border border-blue-900 rounded overflow-hidden">
        <div class="bg-blue-900 text-white p-2 font-bold uppercase">4. INVESTIGACIÓN Y DESCRIPCIÓN DEL SUCESO</div>
        <div class="p-4 space-y-4 bg-slate-50">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="font-bold block text-slate-700 mb-1">Fecha del Evento</label>
              <input type="date" name="fecha_evento" required class="w-full border rounded p-2 bg-white">
            </div>
            <div>
              <label class="font-bold block text-slate-700 mb-1">Hora del Evento</label>
              <input type="time" name="hora_evento" required class="w-full border rounded p-2 bg-white">
            </div>
            <div>
              <label class="font-bold block text-slate-700 mb-1">Lugar Exacto</label>
              <input type="text" name="lugar_exacto" class="w-full border rounded p-2 bg-white">
            </div>
          </div>
          <div>
            <label class="font-bold block text-slate-700 mb-1">4.1 Descripción del Suceso (Solo hechos comprobados)</label>
            <textarea name="descripcion_suceso" rows="4" required class="w-full border rounded p-2 bg-white"></textarea>
          </div>
        </div>
      </div>

      <!-- NOTIFICACIÓN -->
      <div class="bg-amber-100 p-4 rounded border border-amber-300">
        <label class="font-bold block text-slate-800 mb-1">CORREO DESTINO PARA ENVIAR EL ARCHIVO EXCEL:</label>
        <input type="email" name="correo_destino" required placeholder="correo@empresa.com" class="w-full border rounded p-2 bg-white">
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-black py-4 rounded text-sm uppercase tracking-wider shadow-lg transition">
        💾 GUARDAR Y REGISTRAR EN EXCEL
      </button>

    </form>
  </div>

</body>
</html>
