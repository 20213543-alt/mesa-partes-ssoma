<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Partes SSOMA - EMAPE S.A.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-8">

  <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-2xl overflow-hidden border border-slate-200">
    
    <div class="bg-slate-900 text-white p-6 border-b-4 border-amber-500">
      <h1 class="text-xl md:text-2xl font-black tracking-wide">MESA DE PARTES SSOMA</h1>
      <p class="text-xs text-amber-400 font-semibold mt-1">EMPRESA MUNICIPAL DE APOYO A PROYECTOS ESTRATÉGICOS S.A.</p>
    </div>

    <form action="/enviar-reporte" method="POST" class="p-6 md:p-8 space-y-6">
      
      <!-- 1. DATOS DEL EVENTO -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 class="text-sm font-bold text-slate-800 border-b pb-2 mb-4">1. DATOS DEL EVENTO</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">TIPO DE EVENTO</label>
            <select name="tipo_evento" required class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
              <option value="Accidente">Accidente</option>
              <option value="Incidente">Incidente</option>
              <option value="Incidente Peligroso">Incidente Peligroso</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">FECHA DEL EVENTO</label>
            <input type="date" name="fecha_evento" required class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">HORA</label>
            <input type="time" name="hora_evento" required class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
          </div>
        </div>
      </div>

      <!-- 2. IDENTIFICACIÓN DEL LESIONADO -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 class="text-sm font-bold text-slate-800 border-b pb-2 mb-4">2. IDENTIFICACIÓN DEL LESIONADO</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1">NOMBRES Y APELLIDOS</label>
            <input type="text" name="nombre_lesionado" placeholder="Ej. Juan Pérez" required class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">EDAD</label>
            <input type="number" name="edad" placeholder="35" required class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
          </div>
          <div class="md:col-span-3">
            <label class="block text-xs font-bold text-slate-600 mb-1">CARGO</label>
            <input type="text" name="cargo" placeholder="Operador" required class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
          </div>
        </div>
      </div>

      <!-- 3. CLASIFICACIÓN T_FACTORES -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 class="text-sm font-bold text-slate-800 border-b pb-2 mb-4">3. CLASIFICACIÓN TÉCNICA (T_FACTORES)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">ACTO SUBESTÁNDAR (AsE)</label>
            <select name="acto_subestandar" class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
              <option value="01">01 - No hubo acto inseguro</option>
              <option value="02">02 - Manipuló equipo en movimiento</option>
              <option value="03">03 - No usó equipo protector</option>
              <option value="04">04 - No cumplió procedimiento</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">CONDICIÓN SUBESTÁNDAR (CsE)</label>
            <select name="condicion_subestandar" class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
              <option value="01">01 - No hubo condición insegura</option>
              <option value="02">02 - Falta de orden y limpieza</option>
              <option value="03">03 - Protección personal inadecuada</option>
            </select>
          </div>
        </div>
      </div>

      <!-- DESCRIPCIÓN Y NOTIFICACIÓN -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">DESCRIPCIÓN BREVE DEL EVENTO</label>
        <textarea name="descripcion" class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300 h-20"></textarea>
      </div>

      <div class="bg-amber-50/50 border border-amber-200 p-4 rounded-xl">
        <label class="block text-xs font-bold text-slate-800 mb-1">CORREO DESTINO (PARA NOTIFICACIÓN)</label>
        <input type="email" name="correo_destino" placeholder="ejemplo@empresa.com" required class="w-full border rounded-lg p-2.5 text-xs bg-white border-slate-300">
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold py-3.5 px-4 rounded-xl shadow-lg text-sm tracking-wider uppercase">
        GRABAR Y REGISTRAR EN EXCEL
      </button>

    </form>
  </div>

</body>
</html>
